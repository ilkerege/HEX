<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hex</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #121933;
      --muted: #7a87a5;
      --accent: #4ea1ff;
      --p1: #ff5a5f;
      --p2: #5cc9a6;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: var(--bg);
      color: #e7ecff;
    }

    .wrap {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 16px;
      height: 100%;
      box-sizing: border-box;
      padding: 16px;
    }

    .panel {
      background: var(--panel);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .title {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .2px;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
      margin-top: -2px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
    }

    input[type="number"],
    select {
      width: 140px;
      background: #0e1430;
      color: #e7ecff;
      border: 1px solid #202a52;
      border-radius: 10px;
      padding: 8px 10px;
    }

    button {
      background: #1b2550;
      color: #e7ecff;
      border: 1px solid #2b3a7a;
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      transition: .15s transform ease;
    }

    button:hover {
      transform: translateY(-1px);
      background: #253169;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: #0f1536;
      border: 1px solid #273067;
      border-radius: 999px;
      font-size: 12px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      display: inline-block;
    }

    .gridline {
      color: #a8b3d0;
      opacity: .6;
      font-size: 12px;
    }

    /* Eski tasarımın canvas stili */
    canvas {
      width: 100%;
      height: 100%;
      background: #0b1020;
      border-radius: 16px;
      box-shadow: inset 0 0 0 1px #1a2249;
      box-sizing: border-box;
    }

    .legend {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .kbd {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
      background: #0f1536;
      border: 1px solid #253169;
      border-radius: 8px;
      padding: 2px 6px;
      color: #cfe1ff;
    }

    @media (max-width: 900px) {
      .wrap {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
      }

      .panel#sidebar {
        min-height: auto;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <section class="panel" id="sidebar">
      <div>
        <h1 class="title">Hex</h1>
        <div class="muted">P1 soldan → sağa, P2 yukarıdan → aşağıya bağlar.</div>
      </div>

      <div class="row">
        <label for="size">Tahta boyutu</label>
        <input id="size" type="number" min="3" max="19" value="11" />
        <button id="new">Yeni Oyun</button>
      </div>

      <div class="row">
        <label for="opponent">Rakip</label>
        <select id="opponent">
          <option value="human">İnsan</option>
          <option value="ai-easy">AI – Kolay</option>
          <option value="ai-medium">AI – Orta</option>
          <option value="ai-hard" selected>AI – Zor</option>
        </select>
      </div>

      <div class="row legend">
        <span class="badge"><span class="dot" style="background:var(--p1)"></span> P1 (Kırmızı) – YATAY</span>
        <span class="badge"><span class="dot" style="background:var(--p2)"></span> P2 (Yeşil) – DİKEY</span>
      </div>

      <div class="row"><strong>Tur:</strong> <span id="turn">P1</span></div>
      <div class="row"><strong>Durum:</strong> <span id="status">Hamle bekleniyor…</span></div>

      <div id="ai-thinking" style="display:none; color:var(--accent); font-size:12px;">AI Düşünüyor...</div>

      <div style="margin-top:14px; line-height:1.45">
        <div class="gridline">İpuçları</div>
        <ul>
          <li>Hücreye tıklayarak taş yerleştir.</li>
          <li>Amacın karşı kenarları birleştirmek.</li>
          <li><span class="kbd">R</span> ile sıfırla, <span class="kbd">Z</span> ile geri al.</li>
        </ul>
      </div>
    </section>
    <section class="panel" style="padding:0; position:relative; overflow:hidden;">
      <canvas id="board"></canvas>
    </section>
  </div>

  <script>
    // ======= HEX MOTORU & GRAFİK =======

    const TAU = Math.PI * 2;
    const SQRT3 = Math.sqrt(3);
    const DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];

    // Bridge patterns (relative coordinates)
    const BRIDGES = [
      { to: [1, -2], via: [[0, -1], [1, -1]] },
      { to: [2, -1], via: [[1, -1], [1, 0]] },
      { to: [1, 1], via: [[1, 0], [0, 1]] },
      { to: [-1, 2], via: [[0, 1], [-1, 1]] },
      { to: [-2, 1], via: [[-1, 1], [-1, 0]] },
      { to: [-1, -1], via: [[-1, 0], [0, -1]] }
    ];

    class DSU {
      constructor(n) { this.p = new Int32Array(n).map((_, i) => i); }
      f(x) { let r = x; while (r !== this.p[r]) r = this.p[r]; let c = x; while (c !== r) { let n = this.p[c]; this.p[c] = r; c = n; } return r; }
      u(a, b) { const ra = this.f(a), rb = this.f(b); if (ra !== rb) this.p[ra] = rb; }
      s(a, b) { return this.f(a) === this.f(b); }
    }

    const state = {
      n: 11,
      hexR: 24,
      cells: [], // {q,r, x,y, owner}
      turn: 1,
      history: [],
      aiMode: 'ai-hard',
      gameOver: false
    };

    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d', { alpha: false });
    const elTurn = document.getElementById('turn');
    const elStatus = document.getElementById('status');
    const elAiThink = document.getElementById('ai-thinking');

    // --- ÇİZİM ve RESOLUTION FIX ---
    function resizeCanvas() {
      const parent = canvas.parentElement;
      const rect = parent.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;

      // CSS pikselleri
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';

      // Fiziksel pikseller
      canvas.width = Math.floor(rect.width * dpr);
      canvas.height = Math.floor(rect.height * dpr);

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      layoutGrid(rect.width, rect.height);
      draw();
    }

    function layoutGrid(w, h) {
      const n = state.n;
      const margin = 20;

      // Hex size calculation
      // Width = (n + 0.5) * sqrt(3) * R
      // Height = (n * 1.5 + 0.5) * R
      const gw = (n + 0.5) * SQRT3;
      const gh = (n * 1.5) + 0.5;

      // Available space
      const aw = w - 2 * margin;
      const ah = h - 2 * margin;

      state.hexR = Math.floor(Math.min(aw / gw, ah / gh));

      const R = state.hexR;
      const hexW = SQRT3 * R;
      const vert = 1.5 * R;

      // Center the board
      const boardW = gw * R;
      const boardH = gh * R;
      const offX = margin + (aw - boardW) / 2 + hexW / 2; // shift center
      const offY = margin + (ah - boardH) / 2 + R;

      state.cells = [];
      for (let r = 0; r < n; r++) {
        for (let q = 0; q < n; q++) {
          const x = offX + (q + r / 2) * hexW;
          const y = offY + r * vert;
          state.cells.push({ q, r, x, y, owner: 0 });
        }
      }
    }

    function hexPath(x, y, r) {
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (Math.PI / 6) + i * (Math.PI / 3);
        const px = x + r * Math.cos(a);
        const py = y + r * Math.sin(a);
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
    }

    function draw() {
      // Clear
      const w = canvas.width / (window.devicePixelRatio || 1);
      const h = canvas.height / (window.devicePixelRatio || 1);
      ctx.fillStyle = '#0b1020';
      ctx.fillRect(0, 0, w, h);

      const R = state.hexR;

      // Shadow / Border pieces
      // (Opsiyonel: Oyun alanı sınırlarını çizmek için ekstra kod eklenebilir ama basit tutuyoruz)

      // Cells
      for (const c of state.cells) {
        // Eski tasarım renkleri ama içi dolu
        let fill = '#121933';
        let stroke = '#202a52';

        if (c.owner === 1) { fill = '#ff5a5f'; stroke = '#ff8a8e'; }
        else if (c.owner === 2) { fill = '#5cc9a6'; stroke = '#8aefcf'; }

        hexPath(c.x, c.y, R - 1);
        ctx.fillStyle = fill;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = stroke;
        ctx.stroke();

        // Son hamle işareti
        if (state.history.length > 0 && state.history[state.history.length - 1] === idx(c.q, c.r)) {
          ctx.fillStyle = 'rgba(255,255,255,0.3)';
          ctx.fill();
          ctx.strokeStyle = '#fff';
          ctx.stroke();
        }
      }

      // Kenar renkleri (Board'un kimin nereye gittiğini göstermesi için)
      // Sol/Sağ altına kırmızı çizgi, Üst/Alt yanına yeşil çizgi
      // Basitçe ilk ve son satır/sütun etrafına minik indikatorler
    }

    function idx(q, r) { return r * state.n + q; }

    // ======= OYUN MANTIĞI =======

    function newGame(n) {
      state.n = n;
      state.turn = 1;
      state.history = [];
      state.gameOver = false;
      resizeCanvas();
      updateUI();
    }

    function move(i) {
      if (state.gameOver || state.cells[i].owner !== 0) return;
      state.cells[i].owner = state.turn;
      state.history.push(i);

      if (checkWin(state.cells, state.turn)) {
        state.gameOver = true;
        elStatus.textContent = (state.turn === 1 ? "P1 (Kırmızı)" : "P2 (Yeşil)") + " KAZANDI!";
        draw();
        return;
      }

      state.turn = 3 - state.turn;
      updateUI();
      draw();

      if (!state.gameOver && state.turn === 2 && state.aiMode !== 'human') {
        elAiThink.style.display = 'block';
        setTimeout(() => {
          aiPlay();
          elAiThink.style.display = 'none';
        }, 50);
      }
    }

    function undo() {
      if (state.history.length === 0) return;
      const count = (state.aiMode !== 'human' && state.turn === 1) ? 2 : 1;
      for (let k = 0; k < count; k++) {
        if (state.history.length === 0) break;
        const i = state.history.pop();
        state.cells[i].owner = 0;
        state.turn = 3 - state.turn; // switch back
      }
      state.gameOver = false;
      updateUI();
      draw();
    }

    function updateUI() {
      elTurn.textContent = (state.turn === 1 ? "P1 (Kırmızı)" : "P2 (Yeşil)");
      if (!state.gameOver) elStatus.textContent = "Hamle bekleniyor...";
    }

    function checkWin(cells, p) {
      const n = state.n;
      const dsu = new DSU(n * n + 2);
      const S = n * n, E = n * n + 1;

      // Kenarları bağla
      for (let i = 0; i < n * n; i++) {
        if (cells[i].owner !== p) continue;
        const q = i % n, r = Math.floor(i / n);
        if (p === 1) { // Sol-Sağ
          if (q === 0) dsu.u(i, S);
          if (q === n - 1) dsu.u(i, E);
        } else { // Üst-Alt
          if (r === 0) dsu.u(i, S);
          if (r === n - 1) dsu.u(i, E);
        }
        for (const [dq, dr] of DIRS) {
          const nq = q + dq, nr = r + dr;
          if (nq >= 0 && nq < n && nr >= 0 && nr < n) {
            const ni = nr * n + nq;
            if (cells[ni].owner === p) dsu.u(i, ni);
          }
        }
      }
      return dsu.s(S, E);
    }

    // ======= GÜÇLENDİRİLMİŞ AI =======
    // Djikstra Potansiyel Alanı + Bridge Farkındalığı

    function aiPlay() {
      const mode = state.aiMode;
      // Basit ve Orta aynı kalabilir veya iyileştirilebilir
      // HARD için özel algoritma

      let bestMove = -1;

      if (mode === 'ai-easy') {
        const avail = state.cells.map((c, i) => i).filter(i => state.cells[i].owner === 0);
        if (avail.length > 0) bestMove = avail[Math.floor(Math.random() * avail.length)];
      }
      else {
        // Medium ve Hard için heuristic
        // Hard daha fazla analiz yapar
        bestMove = solveHex(state.aiMode === 'ai-hard');
      }

      if (bestMove !== -1) move(bestMove);
    }

    function solveHex(isHard) {
      // 1. Tehdit Kontrolü (Hızlı kazanma/kaybetme) - Instant Win/Loss
      // (Burası karmaşık olduğu için heuristic puana yediriyoruz)

      let bestScore = -Infinity;
      let candidates = [];

      // Tüm boş hücreleri değerlendir
      // Performans için: Sadece dolu hücrelerin komşularına ve merkeze bakabiliriz (Pruning)
      // Ama 11x11'de (121 hücre) hepsine bakmak sorun değil.

      const empties = state.cells.map((c, i) => i).filter(i => state.cells[i].owner === 0);

      // Merkeziyetçilik bonusu hesapla (önce hesapla)
      const n = state.n;
      const center = n / 2;

      for (const idx of empties) {
        const c = state.cells[idx];

        // Simüle et
        c.owner = 2; // AI

        // Heuristic Puanlama
        // Puan = (Benim yolum ne kadar kısaldı?) + (Rakibin yolu ne kadar uzadı?)

        const myDist = getShortestPath(2);
        const oppDist = getShortestPath(1);

        // Bridge analizi: Eğer bu hamle bir bridge oluşturuyorsa bonus
        // Rakibin bridgeni bozuyorsa bonus

        // Temel Puan: Rakip ile aradaki farkı aç. 
        // Rakibin mesafesi ne kadar büyükse o kadar iyi. Benimki ne kadar küçükse o kadar iyi.
        // Score = OppDist - MyDist

        // Ancak "Sonsuz" (Yol yok) durumları önemli.
        // OppDist infinity ise KAZANDIK demektir (neredeyse).
        let score = (oppDist * 100) - (myDist * 100);

        // Merkez bonusu (0.5 puan civarı)
        const distC = Math.abs(c.q - center) + Math.abs(c.r - center);
        score -= distC; // Merkeze yakınlık iyidir (loss az)

        // Hard modda 2. seviye bakış (Minimax-lite)
        // "Ben buraya oynarsam, rakibin en iyi cevabı ne olur?" 
        // Bu çok pahalı, o yüzden sadece kritik anlarda yapılmalı.
        // Şimdilik heuristic'i güçlendirelim.

        // Bridge Kontrolü:
        // Eğer komşularımda kendi taşım varsa ve arada bir boşluk varsa o bridge değildir, düz bağdır.
        // Bridge: Arada bir boşluk var ama o boşluğa oynanınca bağlantı kopmuyor (çünkü öbür taraftan bağlanıyor).
        // Heuristic path finding zaten bridge'leri "1 adım" gibi görüyor (weight 0).

        c.owner = 0; // Geri al

        if (score > bestScore) {
          bestScore = score;
          candidates = [idx];
        } else if (score === bestScore) {
          candidates.push(idx);
        }
      }

      return candidates[Math.floor(Math.random() * candidates.length)];
    }

    // Dijkstra Shortest Path
    // Taşlar arası mesafe 0. Boş hücreden geçiş 1.
    function getShortestPath(player) {
      const n = state.n;
      // Dist array init
      // Kenarlar başlangıç
      // Priority Queue yerine basit array (performans yeterli)

      const dist = new Int32Array(n * n).fill(99999);
      let q = [];

      // Init Queue
      if (player === 1) { // Sol -> Sağ
        for (let r = 0; r < n; r++) {
          const i = r * n; // q=0
          const cost = state.cells[i].owner === player ? 0 : (state.cells[i].owner === 0 ? 1 : 99999);
          if (cost < 99999) { dist[i] = cost; q.push(i); }
        }
      } else { // Üst -> Alt
        for (let c = 0; c < n; c++) {
          const i = c; // r=0
          const cost = state.cells[i].owner === player ? 0 : (state.cells[i].owner === 0 ? 1 : 99999);
          if (cost < 99999) { dist[i] = cost; q.push(i); }
        }
      }

      // Dijkstra Loop (Basitleştirilmiş, A* değil)
      // 0-1 BFS mantığıyla optimize edilebilir ama düz array.sort yapalım veya 
      // iki arrayli bucket queue kullanalım (0 ve 1 maliyet için) -> Çok daha hızlı.

      let bucket0 = [];
      let bucket1 = [];

      // İlk queue'yu bucketlara dağıt
      for (const i of q) {
        if (dist[i] === 0) bucket0.push(i); else bucket1.push(i);
      }

      while (bucket0.length > 0 || bucket1.length > 0) {
        const u = bucket0.length ? bucket0.shift() : bucket1.shift();
        const d = dist[u];

        const uq = u % n;
        const ur = Math.floor(u / n);

        // Hedef kontrolü
        if (player === 1 && uq === n - 1) return d;
        if (player === 2 && ur === n - 1) return d;

        for (const [dq, dr] of DIRS) {
          const nq = uq + dq, nr = ur + dr;
          if (nq >= 0 && nq < n && nr >= 0 && nr < n) {
            const v = nr * n + nq;
            if (state.cells[v].owner === (3 - player)) continue; // Rakip engel

            const weight = (state.cells[v].owner === player) ? 0 : 1;
            if (dist[u] + weight < dist[v]) {
              dist[v] = dist[u] + weight;
              if (weight === 0) bucket0.push(v); else bucket1.push(v);
            }
          }
        }
      }
      return 99999; // Bağlantı yok
    }

    // ======= ETKİLEŞİM =======
    function clickHandler(e) {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      // Event koordinatları CSS pixel'dir, rect de CSS pixel'dir. Uyumlu.
      // Ancak layoutGrid ve draw fonksiyonlarında dpr işin içine giriyor mu?
      // layoutGrid -> rect.width kullanıyor (CSS px).
      // draw -> canvas.width (Fiziksel px) kullanıyor ama scale(dpr) ile çiziyor.
      // Yani state.cells[].x koordinatları CSS pikseli cinsindendir.
      // Mouse da CSS pikseli.

      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;

      // En yakın hücreyi bul
      let bestDist = Infinity, bestI = -1;
      for (let i = 0; i < state.cells.length; i++) {
        const c = state.cells[i];
        const dx = mx - c.x;
        const dy = my - c.y;
        const d = dx * dx + dy * dy;
        if (d < bestDist) { bestDist = d; bestI = i; }
      }

      // Yarıçap kontrolü
      if (bestI !== -1 && bestDist < state.hexR * state.hexR * 1.5) {
        move(bestI);
      }
    }

    window.addEventListener('resize', resizeCanvas);
    canvas.addEventListener('mouseup', clickHandler); // Click bazen kayıyor, mouseup daha iyi

    document.getElementById('new').onclick = () => newGame(parseInt(document.getElementById('size').value));
    document.getElementById('opponent').onchange = (e) => state.aiMode = e.target.value;

    window.addEventListener('keydown', e => {
      if (e.key.toLowerCase() === 'z') undo();
      if (e.key.toLowerCase() === 'r') newGame(state.n);
    });

    // Başlat
    newGame(11);
  </script>
</body>

</html>
